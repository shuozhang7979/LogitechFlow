name: Build Oink for local Mac signing

on:
  push:
    branches: ['codex/oink-personal-macos-*']
  workflow_dispatch:
    inputs:
      team_id:
        description: Apple Development certificate Team ID
        type: string
        required: true

permissions:
  contents: read

jobs:
  prepare-macos:
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: oink-0.3.6
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      PYTHONUTF8: '1'
      MACOSX_DEPLOYMENT_TARGET: '14.2'
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - name: Resolve Team ID
        id: team
        working-directory: .
        env:
          INPUT_TEAM_ID: ${{ inputs.team_id }}
        run: |
          team_id="$INPUT_TEAM_ID"
          if [[ "$GITHUB_EVENT_NAME" == 'push' ]]; then
            team_id="${GITHUB_REF_NAME#codex/oink-personal-macos-}"
          fi
          if [[ ! "$team_id" =~ ^[A-Z0-9]{10}$ ]]; then
            echo '::error::Use a 10-character Apple Development Team ID as the workflow input or branch suffix.'
            exit 1
          fi
          printf 'id=%s\n' "$team_id" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: '1.99.0'
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: oink-0.3.6
          key: macos-arm64-local-signing
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.6'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: oink-0.3.6/package-lock.json
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4
        with:
          path: |
            ~/.cargo/bin/cargo-about*
            ${{ runner.temp }}/package-tools
          key: tools-macos-arm64-local-signing-about0.9.2
      - name: Pin npm and cargo-about
        run: |
          npm install --global npm@11.11.0
          if ! cargo about --version 2>/dev/null | grep -q '0.9.2$'; then
            cargo install cargo-about --version 0.9.2 --locked --features cli
          fi
      - name: Build the app for local signing
        env:
          OINK_TEAM_ID: ${{ steps.team.outputs.id }}
        run: |
          python build-support/package.py --public-version --platform macos --arch arm64 \
            --prepare-development "$OINK_TEAM_ID" --sequence "$GITHUB_RUN_NUMBER" \
            --output-root "$RUNNER_TEMP/packages" --tool-cache "$RUNNER_TEMP/package-tools"
          cd "$RUNNER_TEMP"/packages/*/macos-arm64
          shasum -a 256 -c SHA256SUMS
          mkdir "$RUNNER_TEMP/oink-development-staging"
          cp Oink-*-development-staging.zip SHA256SUMS "$RUNNER_TEMP/oink-development-staging/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oink-macos-arm64-development-staging
          path: ${{ runner.temp }}/oink-development-staging/
          if-no-files-found: error
