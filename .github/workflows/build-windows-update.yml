name: Build Oink Windows update

on:
  push:
    branches: ['codex/oink-windows-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-windows:
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        working-directory: oink-0.3.6
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
      PYTHONUTF8: '1'
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: '1.99.0'
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: oink-0.3.6
          key: windows-x64
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.6'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: oink-0.3.6/package-lock.json
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4
        with:
          path: |
            ~/.cargo/bin/cargo-about*
            ${{ runner.temp }}/package-tools
          key: tools-windows-x64-about0.9.2-wix5.0.2
      - name: Pin npm and cargo-about
        shell: cmd
        run: |
          call npm.cmd install --global npm@11.11.0 || exit /b 1
          if not exist "%USERPROFILE%\.cargo\bin\cargo-about.exe" (
            cargo install cargo-about --version 0.9.2 --locked --features cli || exit /b 1
          )
      - name: Build and verify the Windows x64 MSI
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 || exit /b 1
          python build-support/package.py --public-version --platform windows --sequence %GITHUB_RUN_NUMBER% --output-root "%RUNNER_TEMP%\packages" --tool-cache "%RUNNER_TEMP%\package-tools" || exit /b 1
      - name: Verify installer checksum and collect upgrade files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content packaging/identity.json -Raw | ConvertFrom-Json).version
          $package = @(Get-Item "$env:RUNNER_TEMP/packages/*/windows-x64/Oink-$version-windows-x64.msi")
          if ($package.Count -ne 1) { throw 'Expected exactly one MSI for the selected Oink version.' }
          $checksum = Join-Path $package[0].DirectoryName 'SHA256SUMS'
          $expected = '{0}  {1}' -f (Get-FileHash -LiteralPath $package[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $package[0].Name
          if ((Get-Content -LiteralPath $checksum -Raw).Trim() -cne $expected) { throw 'Windows installer checksum does not match its packaging manifest.' }
          $output = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/oink-windows-update"
          Copy-Item -LiteralPath @($package[0].FullName, $checksum) -Destination $output.FullName
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oink-windows-x64-update
          path: ${{ runner.temp }}/oink-windows-update/
          if-no-files-found: error
