name: Build Installers (macOS & Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-installers-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  PYTHONUTF8: '1'
  MACOSX_DEPLOYMENT_TARGET: '14.2'
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  deskspan:
    name: Build & Test DeskSpan CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Run DeskSpan Go unit tests
        run: go test -v ./...
      - name: Cross-compile DeskSpan binaries
        run: |
          mkdir -p "$RUNNER_TEMP/deskspan"
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o "$RUNNER_TEMP/deskspan/deskspan-macos-arm64" ./cmd/deskspan
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -o "$RUNNER_TEMP/deskspan/deskspan-macos-x64" ./cmd/deskspan
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o "$RUNNER_TEMP/deskspan/deskspan.exe" ./cmd/deskspan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deskspan-binaries
          path: ${{ runner.temp }}/deskspan/*
          if-no-files-found: error

  oink-macos:
    name: Build Oink macOS (arm64 DMG & App)
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: oink-0.3.6
    env:
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '4'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: '1.99.0'
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: oink-0.3.6
          key: macos-arm64
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.6'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: oink-0.3.6/package-lock.json
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4
        with:
          path: |
            ~/.cargo/bin/cargo-about*
            ${{ runner.temp }}/package-tools
          key: tools-macos-arm64-about0.9.2
      - name: Pin npm and cargo-about
        run: |
          npm install --global npm@11.11.0
          if ! cargo about --version 2>/dev/null | grep -q '0.9.2$'; then cargo install cargo-about --version 0.9.2 --locked --features cli; fi
      - name: Verify frontend, FileProvider, and core Rust tests
        run: |
          npm ci
          npm run -w apps/oink typecheck
          npm run -w apps/oink test -- --run
          python packaging/macos/check.py --test
          cargo test -p oink-protocol -p oink-network -p oink-locator -p oink-clipboard -p oink-agent --lib
      - name: Build ad-hoc signed macOS DMG & ZIP
        run: |
          python build-support/package.py --public-version --platform macos --arch arm64 --adhoc --sequence 2 --output-root "$RUNNER_TEMP/packages" --tool-cache "$RUNNER_TEMP/package-tools"
          mkdir -p "$RUNNER_TEMP/dist-macos"
          cp "$RUNNER_TEMP"/packages/*/macos-arm64/Oink-*.dmg "$RUNNER_TEMP/dist-macos/"
          cp "$RUNNER_TEMP"/packages/*/macos-arm64/Oink-*.zip "$RUNNER_TEMP/dist-macos/"
          cp "$RUNNER_TEMP"/packages/*/macos-arm64/SHA256SUMS "$RUNNER_TEMP/dist-macos/SHA256SUMS-macos.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oink-macos-arm64
          path: ${{ runner.temp }}/dist-macos/*
          if-no-files-found: error

  oink-windows:
    name: Build Oink Windows (x64 MSI)
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        working-directory: oink-0.3.6
    env:
      CARGO_BUILD_JOBS: '4'
      RUST_TEST_THREADS: '4'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: '1.99.0'
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: oink-0.3.6
          key: windows-x64
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.6'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.14.1'
          cache: npm
          cache-dependency-path: oink-0.3.6/package-lock.json
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4
        with:
          path: |
            ~/.cargo/bin/cargo-about*
            ${{ runner.temp }}/package-tools
          key: tools-windows-x64-about0.9.2-wix5.0.2
      - name: Pin npm and cargo-about
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm.cmd install --global npm@11.11.0
          $aboutVer = ""
          try { $aboutVer = (cargo about --version 2>$null) } catch {}
          if ($aboutVer -notmatch '0\.9\.2$') {
            cargo install cargo-about --version 0.9.2 --locked --features cli
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Verify core Rust tests on Windows
        shell: pwsh
        run: |
          cargo test -p oink-protocol -p oink-network -p oink-clipboard --lib
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build Windows x64 MSI Installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dev = Join-Path $vs 'Common7/Tools/VsDevCmd.bat'
          cmd /d /s /c "`"$dev`" -arch=x64 >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              Set-Item -Path "Env:$($Matches[1])" -Value $Matches[2]
            }
          }
          python build-support/package.py --public-version --platform windows --sequence 2 --output-root "$env:RUNNER_TEMP/packages" --tool-cache "$env:RUNNER_TEMP/package-tools"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/dist-windows" | Out-Null
          Copy-Item "$env:RUNNER_TEMP/packages/*/windows-x64/Oink-*.msi" "$env:RUNNER_TEMP/dist-windows/" -Force
          Copy-Item "$env:RUNNER_TEMP/packages/*/windows-x64/SHA256SUMS" "$env:RUNNER_TEMP/dist-windows/SHA256SUMS-windows.txt" -Force
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: oink-windows-x64
          path: ${{ runner.temp }}/dist-windows/*
          if-no-files-found: error

  publish-release:
    name: Assemble Kits & Publish GitHub Release
    needs: [deskspan, oink-macos, oink-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/artifacts
      - name: Assemble all-in-one Mac & Windows install kits
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/release-assets"
          mkdir -p "$OUT" "$RUNNER_TEMP/kit-mac" "$RUNNER_TEMP/kit-win"

          cp "$RUNNER_TEMP"/artifacts/oink-macos-arm64/Oink-*.dmg "$OUT/"
          cp "$RUNNER_TEMP"/artifacts/oink-macos-arm64/Oink-*.zip "$OUT/"
          cp "$RUNNER_TEMP"/artifacts/oink-windows-x64/Oink-*.msi "$OUT/"
          cp "$RUNNER_TEMP"/artifacts/deskspan-binaries/* "$OUT/"

          # All-in-one macOS arm64 kit
          cp "$RUNNER_TEMP"/artifacts/deskspan-binaries/deskspan-macos-arm64 "$RUNNER_TEMP/kit-mac/deskspan"
          chmod +x "$RUNNER_TEMP/kit-mac/deskspan"
          cp "$RUNNER_TEMP"/artifacts/oink-macos-arm64/Oink-*.dmg "$RUNNER_TEMP/kit-mac/"
          cat > "$RUNNER_TEMP/kit-mac/Install-Mac.command" <<'EOF'
          #!/bin/sh
          set -eu
          cd "$(dirname "$0")"
          DMG=$(ls Oink-*.dmg | head -n 1)
          MOUNT=$(mktemp -d /tmp/oink-mnt.XXXXXX)
          trap 'hdiutil detach "$MOUNT" -quiet || true; rmdir "$MOUNT" || true' EXIT
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT"
          pkill -x Oink 2>/dev/null || true
          pkill -f OinkBackend 2>/dev/null || true
          rm -rf /Applications/Oink.app
          ditto "$MOUNT/Oink.app" /Applications/Oink.app
          xattr -cr /Applications/Oink.app
          open /Applications/Oink.app
          echo "Installed and launched /Applications/Oink.app!"
          EOF
          chmod +x "$RUNNER_TEMP/kit-mac/Install-Mac.command"
          (cd "$RUNNER_TEMP/kit-mac" && zip -r "$OUT/LogitechFlow-macos-arm64-kit.zip" .)

          # All-in-one Windows x64 kit
          cp "$RUNNER_TEMP"/artifacts/deskspan-binaries/deskspan.exe "$RUNNER_TEMP/kit-win/deskspan.exe"
          cp "$RUNNER_TEMP"/artifacts/oink-windows-x64/Oink-*.msi "$RUNNER_TEMP/kit-win/"
          cat > "$RUNNER_TEMP/kit-win/Install-Windows.cmd" <<'EOF'
          @echo off
          pushd "%~dp0"
          for %%f in (Oink-*.msi) do (
            echo Installing %%f ...
            msiexec.exe /i "%%f"
            goto :done
          )
          :done
          popd
          EOF
          (cd "$RUNNER_TEMP/kit-win" && zip -r "$OUT/LogitechFlow-windows-x64-kit.zip" .)

          (cd "$OUT" && sha256sum * > SHA256SUMS)
      - name: Publish or update latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.3.6-flow"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/release-assets/"* --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP/release-assets/"* \
              --title "LogitechFlow (Oink 0.3.6 + Real-Time Transfer Monitor & High-Speed Pipeline)" \
              --notes "Includes custom-built Oink 0.3.6 (4 MiB blocks, single-stream Select+Read, parallel CloudFiles hydration, real-time HUD & UI transfer monitor) + DeskSpan CLI for macOS arm64 and Windows x64."
          fi
